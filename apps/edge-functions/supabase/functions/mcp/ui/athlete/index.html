<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Proxima</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: var(--color-background-primary, #111);
        --fg: var(--color-text-primary, #f2f2f2);
        --muted: var(--color-text-secondary, #9a9a9a);
        --border: var(--color-border-primary, #333);
        --btn: var(--color-background-secondary, #222);
        --accent: var(--color-text-accent, #5ec4b6);
        font-family: var(--font-sans, ui-sans-serif, system-ui, sans-serif);
      }
      body { margin: 0; background: var(--bg); color: var(--fg); }
      .shell { padding: 12px 14px 16px; }
      .chrome { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
      .chrome h1 { flex: 1; font-size: 15px; font-weight: 600; margin: 0; line-height: 1.3; }
      .brand { color: var(--accent); font-size: 11px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; margin: 0 0 6px; }
      button {
        background: var(--btn); color: var(--fg); border: 1px solid var(--border);
        border-radius: 6px; padding: 6px 10px; font: inherit; cursor: pointer;
      }
      button:disabled { opacity: 0.4; cursor: default; }
      button.primary { border-color: var(--accent); color: var(--accent); }
      .meta { color: var(--muted); font-size: 12px; margin: 0 0 10px; }
      .actions { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
      .card {
        border: 1px solid var(--border); border-radius: 8px;
        padding: 10px; margin-bottom: 8px;
      }
      .card h2 { margin: 0 0 6px; font-size: 13px; }
      .row { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; margin: 2px 0; }
      .muted { color: var(--muted); }
      .err { color: #e66; font-size: 13px; }
      .empty { color: var(--muted); font-size: 13px; }
      .bars { display: flex; align-items: flex-end; gap: 4px; height: 72px; margin: 8px 0 4px; }
      .bar {
        flex: 1; background: var(--accent); opacity: 0.85; border-radius: 3px 3px 0 0;
        min-height: 2px;
      }
      .cal {
        display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px;
        font-size: 11px; margin-top: 8px;
      }
      .cal .dow { color: var(--muted); text-align: center; padding: 2px 0; }
      .cal .cell {
        aspect-ratio: 1; border: 1px solid var(--border); border-radius: 4px;
        display: flex; align-items: center; justify-content: center;
      }
      .cal .cell.out { opacity: 0.35; }
      .cal .cell.hit { border-color: var(--accent); color: var(--accent); font-weight: 600; }
      .pill {
        display: inline-block; font-size: 10px; padding: 2px 6px; border-radius: 4px;
        border: 1px solid var(--border); color: var(--muted); margin-left: 6px;
      }
      .pill.warn { border-color: #e66; color: #e66; }
      .pill.ok { border-color: var(--accent); color: var(--accent); }
    </style>
  </head>
  <body>
    <div class="shell">
      <p class="brand">Proxima</p>
      <div class="chrome">
        <h1 id="title">Loading…</h1>
        <div class="actions" id="chrome-actions"></div>
      </div>
      <p class="meta" id="meta"></p>
      <div id="body"></div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
