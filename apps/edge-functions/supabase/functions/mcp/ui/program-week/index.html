<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Proxima program week</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: var(--color-background-primary, #111);
        --fg: var(--color-text-primary, #f2f2f2);
        --muted: var(--color-text-secondary, #9a9a9a);
        --border: var(--color-border-primary, #333);
        --btn: var(--color-background-secondary, #222);
        font-family: var(--font-sans, ui-sans-serif, system-ui, sans-serif);
      }
      body { margin: 0; background: var(--bg); color: var(--fg); }
      .shell { padding: 12px 14px 16px; }
      .chrome { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
      .chrome h1 { flex: 1; font-size: 15px; font-weight: 600; margin: 0; line-height: 1.3; }
      .chrome button {
        background: var(--btn); color: var(--fg); border: 1px solid var(--border);
        border-radius: 6px; padding: 6px 10px; font: inherit; cursor: pointer;
      }
      .chrome button:disabled { opacity: 0.4; cursor: default; }
      .meta { color: var(--muted); font-size: 12px; margin: 0 0 10px; }
      .day { border: 1px solid var(--border); border-radius: 8px; padding: 10px; margin-bottom: 8px; }
      .day h2 { margin: 0 0 6px; font-size: 13px; }
      .ex { font-size: 12px; color: var(--muted); margin: 2px 0; }
      .err { color: #e66; font-size: 13px; }
      .empty { color: var(--muted); font-size: 13px; }
    </style>
  </head>
  <body>
    <div class="shell">
      <div class="chrome">
        <button type="button" id="prev" aria-label="Previous week">←</button>
        <h1 id="title">Loading…</h1>
        <button type="button" id="next" aria-label="Next week">→</button>
      </div>
      <p class="meta" id="meta"></p>
      <div id="days"></div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
