<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Proxima program week</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: var(--color-background-primary, #111);
        --fg: var(--color-text-primary, #f2f2f2);
        --muted: var(--color-text-secondary, #9a9a9a);
        --border: var(--color-border-primary, #333);
        --btn: var(--color-background-secondary, #222);
        --accent: var(--color-text-accent, #5ec4b6);
        font-family: var(--font-sans, ui-sans-serif, system-ui, sans-serif);
      }
      body { margin: 0; background: var(--bg); color: var(--fg); }
      .shell { padding: 12px 14px 16px; }
      .chrome { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
      .chrome h1 { flex: 1; font-size: 15px; font-weight: 600; margin: 0; line-height: 1.3; }
      button {
        background: var(--btn); color: var(--fg); border: 1px solid var(--border);
        border-radius: 6px; padding: 6px 10px; font: inherit; cursor: pointer;
      }
      button:disabled { opacity: 0.4; cursor: default; }
      button.primary { border-color: var(--accent); color: var(--accent); }
      .meta { color: var(--muted); font-size: 12px; margin: 0 0 8px; }
      .actions { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
      .banner {
        font-size: 12px; padding: 8px 10px; border-radius: 6px;
        border: 1px solid var(--border); margin-bottom: 10px;
      }
      .banner.pending { border-color: var(--accent); color: var(--accent); }
      .banner.err { border-color: #e66; color: #e66; }
      .banner.ok { border-color: var(--accent); color: var(--muted); }
      .day { border: 1px solid var(--border); border-radius: 8px; padding: 10px; margin-bottom: 8px; }
      .day h2 { margin: 0 0 8px; font-size: 13px; }
      .ex { margin: 0 0 10px; }
      .ex:last-child { margin-bottom: 0; }
      .ex-title { font-size: 12px; font-weight: 600; margin: 0 0 4px; }
      .sets { width: 100%; border-collapse: collapse; font-size: 11px; }
      .sets th { color: var(--muted); font-weight: 500; text-align: left; padding: 2px 4px; }
      .sets td { padding: 2px 4px; }
      .sets input {
        width: 3.5rem; background: var(--btn); color: var(--fg);
        border: 1px solid var(--border); border-radius: 4px; padding: 3px 4px; font: inherit;
      }
      .err { color: #e66; font-size: 13px; }
      .empty { color: var(--muted); font-size: 13px; }
    </style>
  </head>
  <body>
    <div class="shell">
      <div class="chrome">
        <button type="button" id="prev" aria-label="Previous week">←</button>
        <h1 id="title">Loading…</h1>
        <button type="button" id="next" aria-label="Next week">→</button>
      </div>
      <p class="meta" id="meta"></p>
      <div class="actions">
        <button type="button" id="accept" class="primary" disabled>Accept</button>
        <button type="button" id="discard" disabled>Discard</button>
        <button type="button" id="save" class="primary" disabled>Save</button>
      </div>
      <div id="banner" hidden></div>
      <div id="days"></div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
